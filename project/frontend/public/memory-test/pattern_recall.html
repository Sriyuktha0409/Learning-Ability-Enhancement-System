<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Pattern Recall Test</title>
    <link rel="stylesheet" href="pattern_recall.css">
</head>
<body>

    <h1>Pattern Recall Test</h1>
    <p>Remember and select the blocks that are colored complete the level!</p>
    

    <!-- Difficulty Selection -->
    <div id="difficulty-selection">
        <button onclick="selectDifficulty('easy')">Easy</button>
        <button onclick="selectDifficulty('medium')">Medium</button>
        <button onclick="selectDifficulty('hard')">Difficult</button>
    </div>

    <!-- Game Section (Initially Hidden) -->
    <div id="game-section" style="display: none;">
        <h2 id="level-title"></h2>
        <div id="grid-container"></div>

        <button id="submit-button" onclick="checkPattern()" style="display: none;">Submit</button>
        <button id="next-button" onclick="nextLevel()" style="display: none;">Next Level</button>
        <button id="retry-button" onclick="retryLevel()" style="display: none;">Retry</button>

        <p id="result"></p>
    </div>

    <!-- Back to Home -->
    <a href="index.html" class="back-link">Back to Home</a>

    <script src="pattern_recall.js"></script>

</body>
</html>
