<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Test</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            text-align: center;
            background-color: #f5f7fa;
            color: #2d3748;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 90%;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2b6cb0;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .level-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .level-box {
            padding: 18px 24px;
            font-size: 20px;
            font-weight: 600;
            background: #4299e1;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .level-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            background: #3182ce;
        }

        .level-box.locked {
            display: none;
        }

        #questionCounter {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .sentence {
            font-size: 26px;
            margin: 30px 0;
            padding: 20px;
            background-color: #f7fafc;
            border-radius: 12px;
            border-left: 5px solid #4299e1;
            line-height: 1.6;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .correct {
            color: #38a169;
            font-weight: 600;
        }

        .wrong {
            color: #e53e3e;
            text-decoration: underline;
        }

        .button {
            padding: 14px 24px;
            font-size: 18px;
            font-weight: 600;
            background: #4299e1;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px 5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            background: #3182ce;
        }

        .button.secondary {
            background: #e53e3e;
        }

        .button.secondary:hover {
            background: #c53030;
        }

        .button.tertiary {
            background: #38a169;
        }

        .button.tertiary:hover {
            background: #2f855a;
        }

        #recognizedText {
            font-size: 20px;
            margin: 20px 0;
            padding: 15px;
            background-color: #f7fafc;
            border-radius: 8px;
            min-height: 30px;
            border-left: 3px solid #a0aec0;
        }

        #scoreDisplay {
            font-size: 22px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #4299e1;
            width: 0%;
            transition: width 0.3s ease;
        }

        .listening-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #e53e3e;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 1.5s infinite;
            vertical-align: middle;
        }

        .corrections-container {
            margin-top: 20px;
            text-align: left;
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .correction-item {
            margin-bottom: 10px;
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .correction-text {
            flex-grow: 1;
        }

        .play-correction {
            background: #38a169;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(0.95); opacity: 1; }
        }

        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                width: 95%;
            }
            
            .sentence {
                font-size: 22px;
                padding: 15px;
            }
            
            .button {
                padding: 12px 20px;
                font-size: 16px;
                width: 100%;
            }
            
            .button-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="levelSelection">
        <h2>📖 Reading Test</h2>
        <p>Select your difficulty level:</p>
        
        <div class="level-container">
            <div class="level-box" id="easyLevel" onclick="startLevel('easy')">
                Easy Level
            </div>
            <div class="level-box locked" id="mediumLevel" onclick="startLevel('medium')">
                Medium Level
            </div>
            <div class="level-box locked" id="hardLevel" onclick="startLevel('hard')">
                Hard Level
            </div>
        </div>
    </div>

    <div class="container hidden" id="gameContainer">
        <h2 id="gameTitle">Easy Level</h2>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p id="questionCounter">Sentence 1 of 10</p>
        <p id="sentenceDisplay" class="sentence"></p>
        
        <div id="recognizedText">Waiting for your speech...</div>
        
        <div id="feedback" class="hidden"></div>
        
        <div class="button-container">
            <button id="startSpeaking" class="button" onclick="startSpeechRecognition()">
                🎤 Start Speaking
                <span id="listeningIndicator" class="listening-indicator hidden"></span>
            </button>
            <button id="skipButton" class="button secondary" onclick="nextSentence()">⏭ Skip Sentence</button>
            <button class="button tertiary" onclick="returnToLevels()">← Back to Levels</button>
        </div>
    </div>

    <div class="container hidden" id="scoreContainer">
        <h2 id="scoreTitle">Easy Level Results</h2>
        <p id="scoreDisplay"></p>
        
        <div id="correctionsSection" class="corrections-container hidden">
            <h3>Practice these sentences:</h3>
            <div id="correctionsList"></div>
        </div>
        
        <div class="button-container">
            <button id="replayAudio" class="button" onclick="playAllCorrections()">🔊 Listen to All Corrections</button>
            <button id="retryTest" class="button secondary" onclick="retryLevel()">🔄 Retry Level</button>
            <button id="goToExercise" class="button tertiary hidden" onclick="window.location.href='speecher.html'">📚 Go to Exercises</button>
            <button class="button" onclick="returnToLevels()">🏠 Return to Levels</button>
        </div>
    </div>

    <script>
        const allSentences = {
            easy: [
            "The sun rises in the east.", "I love eating chocolate.", "My school has a library.", "She enjoys painting.", "The dog is barking outside.",
            "We should drink clean water.", "The birds are flying in the sky.", "My father is reading a newspaper.", "I like to play football.", "The flowers smell nice.",
            "We should respect our elders.", "I have a pet cat.", "The sky is blue.", "I go to school every day.", "She likes to dance.",
            "The moon shines at night.", "My mother cooks delicious food.", "I saw a rainbow yesterday.", "The train moves fast.", "We wear warm clothes in winter.",
            "I love my grandparents.", "The clock shows the time.", "My best friend lives nearby.", "The trees give us oxygen.", "The cake tastes sweet."
            ],
            medium: [
            "The library has many interesting books.", "We should keep our environment clean.", "My sister loves to sing songs.", "The river flows under the bridge.", "The sun sets in the west.",
            "My uncle is a scientist.", "We should always tell the truth.", "The elephant has a long trunk.", "My mother helps me with my homework.", "The policeman keeps our city safe.",
            "The rainbow appears after the rain.", "I saw a squirrel climbing the tree.", "The doctor treats sick people.", "We should be kind to animals.", "The baker bakes fresh bread every day.",
            "The monkey jumps from one tree to another.", "The students are reading their books.", "The bus stops at the station.", "The gardener waters the plants every morning.", "We should always respect our elders.",
            "The moon looks beautiful at night.", "My best friend lives near my house.", "I enjoy listening to music.", "The aeroplane flies high in the sky.", "The ice cream is melting in the sun."
      
            ],
            hard: [
            "Photosynthesis is the process by which plants make their food.", "The human brain controls all body functions.", "The invention of electricity changed human civilization.", "Gravity pulls objects toward the Earth.", "The water cycle involves evaporation, condensation, and precipitation.",
            "A thermometer is used to measure temperature.", "Friction is a force that opposes motion.", "The Earth revolves around the Sun in 365 days.", "A biography is a story of someone's life written by another person.", "The government is responsible for making laws and maintaining order.",
            "Clouds are formed due to condensation of water vapor.", "The nervous system controls body functions.", "A magnet attracts iron objects.", "The circulatory system transports blood throughout the body.", "Renewable energy sources include solar and wind power.",
            "Deforestation leads to environmental problems.", "The respiratory system helps us breathe.", "The industrial revolution changed the world.", "The moon orbits the Earth.", "Tsunamis are caused by underwater earthquakes.",
            "The heart pumps blood to all parts of the body.", "The digestive system processes food.", "The skeletal system provides structure to the body.", "The Earth's atmosphere protects us from harmful rays.", "The Great Wall of China is one of the Seven Wonders of the World."
            ]
        };

        let currentLevel = "easy";
        let sentences = [];
        let currentSentenceIndex = 0;
        let correctSentences = 0;
        let recognition = null;
        let testCompleted = false;
        let incorrectSentences = [];

        // Initialize the game
        function initializeGame() {
            // Only show Easy level initially
            document.getElementById('mediumLevel').classList.add('locked');
            document.getElementById('hardLevel').classList.add('locked');
            initializeSpeechRecognition();
        }

        function startLevel(level) {
            currentLevel = level;
            sentences = allSentences[level].sort(() => 0.5 - Math.random()).slice(0, 10);
            currentSentenceIndex = 0;
            correctSentences = 0;
            testCompleted = false;
            incorrectSentences = [];
            
            // Update UI
            document.getElementById("levelSelection").classList.add("hidden");
            document.getElementById("gameContainer").classList.remove("hidden");
            document.getElementById("scoreContainer").classList.add("hidden");
            document.getElementById("progressBar").style.width = '0%';
            document.getElementById("feedback").classList.add("hidden");
            document.getElementById("gameTitle").innerText = `${level.charAt(0).toUpperCase() + level.slice(1)} Level`;
            document.getElementById("goToExercise").classList.add("hidden");
            
            displaySentence();
        }

        function initializeSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported in your browser. Try Chrome or Edge.");
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                document.getElementById("recognizedText").innerText = "Listening...";
                document.getElementById("listeningIndicator").classList.remove("hidden");
                document.getElementById("startSpeaking").disabled = true;
            };

            recognition.onresult = function(event) {
                if (event.results[0].isFinal) {
                    processSpeech(event.results[0][0].transcript);
                }
            };

            recognition.onerror = function(event) {
                console.error("Recognition error:", event.error);
                document.getElementById("recognizedText").innerText = 
                    "Error: " + event.error + ". Try again.";
                resetSpeechUI();
            };

            recognition.onend = function() {
                resetSpeechUI();
            };

            return true;
        }

        function resetSpeechUI() {
            document.getElementById("listeningIndicator").classList.add("hidden");
            if (!testCompleted) {
                document.getElementById("startSpeaking").disabled = false;
            }
        }

        function updateProgress() {
            const progress = ((currentSentenceIndex) / sentences.length) * 100;
            document.getElementById("progressBar").style.width = `${progress}%`;
        }

        function displaySentence() {
            document.getElementById("sentenceDisplay").innerText = sentences[currentSentenceIndex];
            document.getElementById("recognizedText").innerText = "Waiting for your speech...";
            document.getElementById("questionCounter").innerText = `Sentence ${currentSentenceIndex + 1} of ${sentences.length}`;
            updateProgress();
        }

        function normalizeText(text) {
            return text.toLowerCase().replace(/[.,!?]/g, '').trim();
        }

        function startSpeechRecognition() {
            if (!recognition) {
                if (!initializeSpeechRecognition()) {
                    return;
                }
            }
            recognition.start();
        }

        function processSpeech(spokenText) {
            const displayTextElement = document.getElementById("sentenceDisplay");
            const output = document.getElementById("recognizedText");
            const feedbackElement = document.getElementById("feedback");
            const originalText = normalizeText(displayTextElement.innerText);
            const currentSentence = sentences[currentSentenceIndex];
            
            spokenText = normalizeText(spokenText);
            output.innerText = spokenText;
            
            const isCorrect = originalText === spokenText;
            
            if (isCorrect) {
                correctSentences++;
                displayTextElement.innerHTML = `<span class='correct'>${currentSentence}</span>`;
                feedbackElement.textContent = "✅ Correct!";
                feedbackElement.className = "correct";
            } else {
                displayTextElement.innerHTML = `<span class='wrong'>${currentSentence}</span>`;
                feedbackElement.textContent = "❌ Try again!";
                feedbackElement.className = "wrong";
                incorrectSentences.push(currentSentence);
            }
            
            feedbackElement.classList.remove("hidden");

            // Move to the next sentence after a short delay
            setTimeout(() => {
                currentSentenceIndex++;
                if (currentSentenceIndex < sentences.length) {
                    displaySentence();
                    feedbackElement.classList.add("hidden");
                } else {
                    finishTest();
                }
            }, 2000);
        }

        function finishTest() {
            testCompleted = true;
            const percentage = Math.round((correctSentences / sentences.length) * 100);
            const scoreDisplay = document.getElementById("scoreDisplay");
            const scoreTitle = document.getElementById("scoreTitle");
            const correctionsSection = document.getElementById("correctionsSection");
            const correctionsList = document.getElementById("correctionsList");
            
            scoreTitle.innerText = `${currentLevel.charAt(0).toUpperCase() + currentLevel.slice(1)} Level Results`;
            scoreDisplay.innerHTML = `
                <strong>Your Score: ${percentage}%</strong><br>
                (${correctSentences} out of ${sentences.length} sentences correct)
            `;
            
            // Show corrections if any sentences were incorrect
            if (incorrectSentences.length > 0) {
                correctionsList.innerHTML = '';
                incorrectSentences.forEach((sentence, index) => {
                    const correctionItem = document.createElement('div');
                    correctionItem.className = 'correction-item';
                    correctionItem.innerHTML = `
                        <div class="correction-text">${sentence}</div>
                        <button class="play-correction" onclick="playSentence(${index})">▶ Play</button>
                    `;
                    correctionsList.appendChild(correctionItem);
                });
                correctionsSection.classList.remove("hidden");
            } else {
                correctionsSection.classList.add("hidden");
            }
            
            // Unlock next level if score is 70% or higher
            if (percentage >= 70) {
                if (currentLevel === 'easy') {
                    document.getElementById('mediumLevel').classList.remove('locked');
                    scoreDisplay.innerHTML += `<br><br>🎉 Medium Level Unlocked!`;
                } else if (currentLevel === 'medium') {
                    document.getElementById('hardLevel').classList.remove('locked');
                    scoreDisplay.innerHTML += `<br><br>🎉 Hard Level Unlocked!`;
                }
            } else {
                document.getElementById("goToExercise").classList.remove("hidden");
                scoreDisplay.innerHTML += `<br><br>😊 Keep practicing! You'll improve with time.`;
            }
            
            document.getElementById("gameContainer").classList.add("hidden");
            document.getElementById("scoreContainer").classList.remove("hidden");
            updateProgress();
        }

        function playSentence(index) {
            const utterance = new SpeechSynthesisUtterance(incorrectSentences[index]);
            speechSynthesis.speak(utterance);
        }

        function playAllCorrections() {
            if (incorrectSentences.length === 0) return;
            
            let index = 0;
            const playNext = () => {
                if (index < incorrectSentences.length) {
                    const utterance = new SpeechSynthesisUtterance(incorrectSentences[index]);
                    utterance.onend = () => {
                        index++;
                        setTimeout(playNext, 1000); // 1 second pause between sentences
                    };
                    speechSynthesis.speak(utterance);
                }
            };
            playNext();
        }
        
        function retryLevel() {
            startLevel(currentLevel);
        }

        function returnToLevels() {
            document.getElementById("gameContainer").classList.add("hidden");
            document.getElementById("scoreContainer").classList.add("hidden");
            document.getElementById("levelSelection").classList.remove("hidden");
        }

        // Initialize the game when page loads
        window.onload = initializeGame;
    </script>
</body>
</html>
